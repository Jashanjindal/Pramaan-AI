version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pramaan-ai-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pramaansecurepassword2026
      POSTGRES_DB: pramaan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pramaan-ai-backend
    restart: always
    environment:
      - MONGODB_URL=mongodb+srv://anshiag7206_db_user:KVR52VnMvveiqf0s@pramaan.mmeciht.mongodb.net/pramaan_db?retryWrites=true&w=majority&appName=Pramaan
      - DATABASE_NAME=pramaan_db
      - SECRET_KEY=super-secret-pramaan-ai-security-hash-key-2026
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pramaan-ai-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
